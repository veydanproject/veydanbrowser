name: Release
run-name: >-
  ${{ contains(github.ref_name, '-alpha.') && 'Alpha'
      || contains(github.ref_name, '-beta.') && 'Beta'
      || contains(github.ref_name, '-rc.') && 'RC'
      || 'Release' }} ${{ github.ref_name }}

# Triggered by `make push release` (vX.Y.Z → linux/windows/macos/android) or
# `make push alpha|beta|rc [linux] [windows] [macos] [android] [ios]`
# (vX.Y.Z-{channel}.N[-platform...], prerelease).
# Channel releases stay prerelease so they never become GitHub /releases/latest.
# ios is accepted on the tag but not built.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      matrix: ${{ steps.meta.outputs.matrix }}
      updater_keys: ${{ steps.meta.outputs.updater_keys }}
      build_desktop: ${{ steps.meta.outputs.build_desktop }}
      build_android: ${{ steps.meta.outputs.build_android }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Parse tag and verify VERSION
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE_VERSION="$(cat VERSION)"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            CHANNEL="stable"
            PRERELEASE="false"
            PLATFORMS="linux windows macos android"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta|rc)\.([0-9]+)((-(linux|windows|macos|android|ios))*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            CHANNEL="${BASH_REMATCH[2]}"
            PRERELEASE="true"
            SUFFIX="${BASH_REMATCH[4]}"
            if [ -z "$SUFFIX" ]; then
              PLATFORMS="linux windows macos"
            else
              PLATFORMS="${SUFFIX//-/ }"
              PLATFORMS="$(echo $PLATFORMS)"
            fi
          else
            echo "::error::Tag $TAG does not match vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N[-linux|-windows|-macos|-android|-ios...]"
            exit 1
          fi

          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi

          include='[]'
          add() {
            include=$(jq -c --arg p "$1" --arg a "$2" '. + [{"platform":$p,"args":$a}]' <<<"$include")
          }
          keys=""
          BUILD_DESKTOP="false"
          BUILD_ANDROID="false"
          for p in $PLATFORMS; do
            case "$p" in
              linux)
                add "ubuntu-22.04" ""
                keys="$keys linux-x86_64"
                BUILD_DESKTOP="true"
                ;;
              windows)
                add "windows-latest" ""
                keys="$keys windows-x86_64"
                BUILD_DESKTOP="true"
                ;;
              macos)
                add "macos-latest" "--target aarch64-apple-darwin"
                add "macos-latest" "--target x86_64-apple-darwin"
                keys="$keys darwin-aarch64 darwin-x86_64"
                BUILD_DESKTOP="true"
                ;;
              android)
                BUILD_ANDROID="true"
                ;;
              ios)
                echo "::notice::Skipping ios (not in CI yet)"
                ;;
            esac
          done
          if [ "$BUILD_DESKTOP" != "true" ] && [ "$BUILD_ANDROID" != "true" ]; then
            echo "::error::No platforms to build"
            exit 1
          fi
          # fromJson needs a non-empty matrix even when the desktop job is skipped
          if [ "$include" = "[]" ]; then
            include='[{"platform":"ubuntu-22.04","args":""}]'
          fi
          keys="$(echo $keys)"
          MATRIX=$(jq -c '{include:.}' <<<"$include")

          echo "channel=$CHANNEL  prerelease=$PRERELEASE  platforms=$PLATFORMS"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "updater_keys=$keys" >> "$GITHUB_OUTPUT"
          echo "build_desktop=$BUILD_DESKTOP" >> "$GITHUB_OUTPUT"
          echo "build_android=$BUILD_ANDROID" >> "$GITHUB_OUTPUT"

  build:
    needs: verify-version
    if: needs.verify-version.outputs.build_desktop == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.verify-version.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl wget file

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}${{ matrix.args }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs updater artifacts (.sig) so installed apps accept them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Veydan Browser ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: ${{ needs.verify-version.outputs.prerelease == 'true' }}
          # latest.json must deterministically point at the NSIS installer
          # (targets "all" builds both NSIS and MSI on Windows).
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # Same SDK/NDK pins as scripts/android/android-env.sh
  build-android:
    needs: verify-version
    if: needs.verify-version.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370
          log-accepted-android-sdk-licenses: false

      - name: Export NDK paths
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-aarch64

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        run: pnpm tauri android build --target aarch64

      - name: Sign and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_KS_PASS: ${{ secrets.ANDROID_RELEASE_KS_PASS }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          PRERELEASE: ${{ needs.verify-version.outputs.prerelease }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE" ] || [ -z "$ANDROID_RELEASE_KS_PASS" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE and ANDROID_RELEASE_KS_PASS secrets are required"
            exit 1
          fi
          ALIAS="${ANDROID_RELEASE_KEY_ALIAS:-veydan}"
          KS=/tmp/android-release.keystore
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 -d > "$KS"

          UNSIGNED="$(find src-tauri/gen/android/app/build/outputs/apk \
            -name '*-unsigned.apk' -printf '%T@\t%p\n' | sort -nr | cut -f2- | head -n1)"
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No unsigned APK after tauri android build"
            exit 1
          fi

          SIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | tail -n1)"
          VERSION="$(cat VERSION)"
          SIGNED="Veydan_${VERSION}_android.apk"
          "$SIGNER" sign --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$ANDROID_RELEASE_KS_PASS" --key-pass "pass:$ANDROID_RELEASE_KS_PASS" \
            --out "$SIGNED" "$UNSIGNED"
          rm -f "$KS"

          # tauri-action may have created the draft already; otherwise create it here
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            PRE=""
            if [ "$PRERELEASE" = "true" ]; then PRE="--prerelease"; fi
            gh release create "$GITHUB_REF_NAME" --draft $PRE \
              --title "Veydan Browser $GITHUB_REF_NAME" \
              --notes "See the assets below to download and install this version."
          fi
          gh release upload "$GITHUB_REF_NAME" "$SIGNED" --clobber

  publish:
    needs: [verify-version, build, build-android]
    # Run when every requested platform succeeded; skipped jobs are fine.
    if: |
      !cancelled() &&
      needs.build.result != 'failure' &&
      needs.build-android.result != 'failure' &&
      (needs.build.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      # Matrix jobs merge platform entries into latest.json via
      # download→merge→re-upload; concurrent finishes can drop an entry.
      # Gate on the platforms this tag requested — a failed gate keeps the
      # release draft; re-run the dropped platform's build job to re-merge.
      - name: Verify latest.json covers requested platforms
        if: needs.verify-version.outputs.updater_keys != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_KEYS: ${{ needs.verify-version.outputs.updater_keys }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json -O latest.json
          for p in $UPDATER_KEYS; do
            jq -e ".platforms[\"$p\"].signature" latest.json >/dev/null \
              || { echo "::error::latest.json is missing platform $p"; exit 1; }
          done

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name==\"$GITHUB_REF_NAME\" and .draft) | .id")"
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Draft release for $GITHUB_REF_NAME not found"
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
