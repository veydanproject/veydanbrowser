name: Release

# Triggered by `make push`: it bumps VERSION, commits and pushes a vX.Y.Z tag.
# Builds installers for Linux / Windows / macOS and attaches them to a GitHub
# Release for that tag. The release is created as a draft and published
# automatically once every platform build succeeds.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the VERSION file
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION)"
          if [ "$TAG" != "$FILE_VERSION" ]; then
            echo "::error::Tag v$TAG does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # older glibc → AppImage runs on more distros
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest # Intel (cross-compiled)
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl wget file

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}${{ matrix.args }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs updater artifacts (.sig) so installed apps accept them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Veydan Browser ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          # latest.json must deterministically point at the NSIS installer
          # (targets "all" builds both NSIS and MSI on Windows).
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The matrix jobs merge their platform entries into the release's
      # latest.json via download→merge→re-upload; two jobs finishing at the
      # same moment can silently drop an entry. Gate publishing on all four
      # platforms being present — a failed gate keeps the release draft, and
      # re-running the dropped platform's build job re-merges its entry.
      - name: Verify latest.json covers all platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json -O latest.json
          for p in linux-x86_64 windows-x86_64 darwin-aarch64 darwin-x86_64; do
            jq -e ".platforms[\"$p\"].signature" latest.json >/dev/null \
              || { echo "::error::latest.json is missing platform $p"; exit 1; }
          done

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name==\"$GITHUB_REF_NAME\" and .draft) | .id")"
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Draft release for $GITHUB_REF_NAME not found"
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
