[package]
name = "messenger-transport"
description = "Messenger network side: relay pool over nostr-sdk implementing core::Transport, and the signed infrastructure manifest"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
messenger-core.workspace = true
nostr.workspace = true
nostr-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures-util.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
nostr-sdk = { workspace = true, features = ["local-relay"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
