[package]
name = "messenger-runtime"
description = "Assembles the messenger graph (store, transport, ingress, handlers) into one object a host embeds"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
messenger-core.workspace = true
messenger-store.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
messenger-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
