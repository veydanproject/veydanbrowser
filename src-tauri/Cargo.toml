[package]
name = "veydanbrowser"
version = "1.0.5"
description = "Anti-detect browser & fingerprint profile manager"
authors = ["Veydan Project"]
edition = "2021"
license-file = "../LICENSE"

[lib]
name = "veydanbrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "chrono", "macros"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["socks", "json", "stream"] }
anyhow = "1"
which = "8"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
zip = "8"
lz4_flex = "0.13"
futures-util = "0.3"
# Capped at 0.39 (libsqlite3-sys 0.37): rusqlite 0.40 needs libsqlite3-sys
# 0.38, which conflicts with sqlx-sqlite 0.9's `libsqlite3-sys <0.38` on the
# native `sqlite3` link. Bump to 0.40 once sqlx moves to libsqlite3-sys 0.38.
rusqlite = "0.39"
base64 = "0.22"
sha2 = "0.11"
russh = "0.62"
russh-sftp = "2"
# CSPRNG for SSH key generation (already in the tree via russh)
rand = { version = "0.10", features = ["thread_rng"] }
tokio-util = "0.7"
async-trait = "0.1.89"
thiserror = "2.0.18"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
notify = "8"
diffy = "0.5"
zstd = "0.13"
# Full-app backup: streaming tar + passphrase (scrypt) authenticated encryption.
# age pinned to 0.11: 0.12 pulls post-quantum crates (ml-kem) that don't build
# on this toolchain, and we only use the scrypt passphrase recipient anyway.
tar = "0.4"
age = { version = "0.11", default-features = false }

# Linux-only: native GTK signal for reliable minimize-to-tray detection
# (Tauri's WindowEvent::Resized / is_minimized() are unreliable on GTK/Wayland).
# Pinned to the same version Tauri 2.11 pulls in so the gtk_window() type matches.
[target.'cfg(target_os = "linux")'.dependencies]
# Native StatusNotifierItem impl: unlike Tauri's libappindicator backend it
# exposes separate left-click (Activate) and right-click (ContextMenu) handlers,
# which KDE Plasma honors — used for the Linux tray so left-click opens the app.
ksni = "0.3"
