[package]
name = "veydanbrowser"
version = "1.0.1"
description = "Anti-detect browser & fingerprint profile manager"
authors = ["Veydan Project"]
edition = "2021"
license-file = "../LICENSE"

[lib]
name = "veydanbrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "chrono", "macros"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["socks", "json", "stream"] }
anyhow = "1"
which = "8"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
zip = "8"
lz4_flex = "0.13"
futures-util = "0.3"
# Capped at 0.39 (libsqlite3-sys 0.37): rusqlite 0.40 needs libsqlite3-sys
# 0.38, which conflicts with sqlx-sqlite 0.9's `libsqlite3-sys <0.38` on the
# native `sqlite3` link. Bump to 0.40 once sqlx moves to libsqlite3-sys 0.38.
rusqlite = "0.39"
base64 = "0.22"
sha2 = "0.11"
russh = "0.62"
russh-sftp = "2"
# CSPRNG for SSH key generation (already in the tree via russh)
rand = { version = "0.10", features = ["thread_rng"] }
tokio-util = "0.7"
async-trait = "0.1.89"
thiserror = "2.0.18"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
notify = "8"
diffy = "0.5"
zstd = "0.13"
