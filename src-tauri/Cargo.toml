[package]
name = "veydanbrowser"
version = "2.0.6"
description = "Anti-detect browser & fingerprint profile manager"
authors = ["Veydan Project"]
edition = "2021"
license-file = "../LICENSE"

[lib]
# One library for every platform: desktop main.rs and the Android/iOS bootstrap load it.
name = "veydan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ── Shared core: notes, TOTP, sync, settings ─────────────────────────────────
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "chrono", "macros"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
base64 = "0.22"
sha2 = "0.11"
# CSPRNG for SSH key generation (already in the tree via russh)
rand = { version = "0.10", features = ["thread_rng"] }
async-trait = "0.1.89"
thiserror = "2.0.18"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
notify = "8"
diffy = "0.5"
zstd = "0.13"
# Device name for the sync lease badge (already in the tree)
gethostname = "1"
# Notes lock password hashing
argon2 = "0.6.0-rc.8"
# E2E-encrypted sync core (folder / S3 / WebDAV); Tauri-free so mobile can reuse it.
veydan-sync = { path = "crates/veydan-sync" }

# ── Desktop only: browser, proxies, SSH/SFTP, backup, tray, updater ──────────
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# Open http(s) links in the system browser without going through a shell
tauri-plugin-opener = "2"
url = "2"
reqwest = { version = "0.13", features = ["socks", "json", "stream"] }
which = "8"
zip = "8"
lz4_flex = "0.13"
# File list from the OS clipboard (webviews hide pasted file paths from JS)
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
futures-util = "0.3"
# Capped at 0.39 (libsqlite3-sys 0.37): rusqlite 0.40 needs libsqlite3-sys
# 0.38, which conflicts with sqlx-sqlite 0.9's `libsqlite3-sys <0.38` on the
# native `sqlite3` link. Bump to 0.40 once sqlx moves to libsqlite3-sys 0.38.
rusqlite = "0.39"
# Escape proxy credentials when building proxy URLs (already in the tree via reqwest/url)
percent-encoding = "2"
russh = "0.62"
russh-sftp = "2"
tokio-util = "0.7"
# Full-app backup: streaming tar + passphrase (scrypt) authenticated encryption.
# age pinned to 0.11: 0.12 pulls post-quantum crates (ml-kem) that don't build
# on this toolchain, and we only use the scrypt passphrase recipient anyway.
tar = "0.4"
age = { version = "0.11", default-features = false }

# ── Mobile only ──────────────────────────────────────────────────────────────
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
# Native file picker (content:// URIs) and fd-based reads of those URIs.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# ContentResolver queries for picked files (display name, size).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Linux-only: native GTK signal for reliable minimize-to-tray detection
# (Tauri's WindowEvent::Resized / is_minimized() are unreliable on GTK/Wayland).
# Pinned to the same version Tauri 2.11 pulls in so the gtk_window() type matches.
[target.'cfg(target_os = "linux")'.dependencies]
# Native StatusNotifierItem impl: unlike Tauri's libappindicator backend it
# exposes separate left-click (Activate) and right-click (ContextMenu) handlers,
# which KDE Plasma honors — used for the Linux tray so left-click opens the app.
ksni = "0.3"
# Answer WebKitGTK media permission requests (camera / microphone in notes)
webkit2gtk = "2"
