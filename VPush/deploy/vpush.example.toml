# VPush configuration.
#
# Check it without starting anything:   vpush check-config --config <this file>
# An unknown key or a wrong type is an error, never silently ignored.

# The address clients use, exactly as they see it. No trailing slash.
public_url = "https://push.example.org"

[server]
# TLS is done by the reverse proxy (nginx, caddy) in front, so VPush listens
# on the loopback only.
listen = "127.0.0.1:8090"
request_timeout_secs = 15
max_body_bytes = 65536
# Set to true when every request comes through the reverse proxy, and the
# proxy names the client in X-Real-IP (deploy/nginx.example.conf does). New
# devices are then counted by the address they are registered from, 20 an
# hour. While it is false that limit is off: the server sees only the
# proxy's address, and a header is whatever a client wrote.
trusted_proxy = false

[admin]
# Socket of `vpush ctl`. Only the vpush user and group can open it.
socket = "/run/vpush/admin.sock"

[log]
# text | json
format = "text"
# Level of everything not named below: off, error, warn, info, debug, trace.
level = "info"

# Level per module, or per crate. Changed on the running server with
#   vpush ctl log set relay=debug --for 15m
# and re-read from this file on `systemctl reload vpush`.
[log.targets]
#relay = "debug"
#nostr_sdk = "warn"

# Apps whose devices are served. A token of FCM or APNs belongs to one app,
# so every app brings its own keys. The id is what the app sends when it
# registers.
#
#[apps."net.veydan.mobile".fcm]
# The service account file of the Firebase project:
# Firebase console -> Project settings -> Service accounts -> Generate new private key.
# Put it in /opt/vpush/etc/secrets/, readable by the vpush user only.
#service_account = "/opt/vpush/etc/secrets/fcm-veydan.json"
#
# Reserved. The section is read and checked; delivery to iOS is not built yet.
#[apps."net.veydan.mobile".apns]
#key_file = "/opt/vpush/etc/secrets/apns-veydan.p8"
#key_id = "ABC123DEFG"
#team_id = "TEAM123456"
#topic = "net.veydan.mobile"

[store]
# The database: one file, made when missing.
path = "/opt/vpush/data/vpush.db"

# Which relays are watched. Today the only policy is the list below: a relay
# that is not on it is refused, and the client is told so.
[relays]
policy = "allow_list"

#[[relays.allow]]
#url = "wss://relay.example.org"
#
# A relay behind a gate: the key is kept in a file, never in this one, and
# never in the address.
#[[relays.allow]]
#url = "wss://node-1.veydan.net"
#api_key_file = "/opt/vpush/etc/secrets/node-1-relay.key"

[limits]
devices_per_pubkey = 10
relays_per_device = 16
groups_per_device = 500
# A registration nobody renewed for this long is forgotten.
registration_days = 30
# Test pushes a device may ask for in an hour.
test_per_hour = 3
# Devices of all owners together. A registration that would be one more is
# refused; those who are registered renew as before.
devices_total = 100000

[pipeline]
# A device is woken about one chat once in this many seconds. What comes in
# between is counted, and told in one push when the time is up.
throttle_secs = 20
# A device is pushed to no more than device_cap times in device_window_secs,
# whatever the pushes are about. What comes over that is counted, and told
# in one push ("N new messages") when the time is up.
device_cap = 30
device_window_secs = 60
