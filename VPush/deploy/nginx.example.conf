# VPush behind nginx. Add these two blocks to the nginx config of the server.
#
# Written for nginx running in a docker container next to VPush on the host
# (the setup of node-1): VPush listens on the docker bridge, 172.17.0.1:8090,
# and ufw lets docker networks reach that port and nobody else:
#
#   ufw allow proto tcp from 172.16.0.0/12 to 172.17.0.1 port 8090
#
# With nginx on the host itself, VPush stays on 127.0.0.1:8090 and
# proxy_pass points there.
#
# The certificate is a separate one, so VPush can move to another server
# without touching the relay's:
#
#   certbot certonly --standalone --cert-name vpush.veydan.net -d vpush.veydan.net \
#     --pre-hook  "docker compose -f /root/stack/docker-compose.yml stop nginx" \
#     --post-hook "docker compose -f /root/stack/docker-compose.yml up -d nginx"

server {
    listen 80;
    server_name vpush.veydan.net;
    return 301 https://vpush.veydan.net$request_uri;
}

server {
    listen 443 ssl;
    server_name vpush.veydan.net;

    ssl_certificate     /etc/letsencrypt/live/vpush.veydan.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpush.veydan.net/privkey.pem;

    # The query is left out of the log: nothing secret goes there today, and
    # nothing should start going there by accident.
    access_log /var/log/nginx/access.log nokey;

    # VPush refuses more itself (server.max_body_bytes); this stops it earlier.
    client_max_body_size 64k;

    location / {
        limit_req zone=perip burst=20 nodelay;

        # No path after the address: the request goes on exactly as it came.
        # Registration checks a signature over the full URL, and a rewritten
        # path would break it.
        proxy_pass http://172.17.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
